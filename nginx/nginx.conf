user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Gzip 압축 설정
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;

    # 업스트림 서비스 정의
    upstream user-service {
        server user-service-app:8081;
    }

    upstream problem-service {
        server problem-service-app:8082;
    }

    upstream learning-analysis-service {
        server learning-service-app:8083;
    }

    upstream media-service {
        server media-service-app:8084;
    }

    upstream speech-service {
        server speech-service-app:8085;
    }

    # 인증 서비스 (JWT 검증용)
    upstream auth-service {
        server user-service-app:8081;
    }

    # 설정 파일 포함
    include /etc/nginx/conf.d/*.conf;
}

