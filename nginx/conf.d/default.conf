# API Gateway 설정
# JWT 토큰 검증 및 서비스 라우팅

# 인증 서비스 내부 위치 (JWT 검증용)
# 이 서비스는 UserService의 /api/auth/validate 엔드포인트를 호출
server {
    listen 80;
    server_name localhost;

    # CORS 설정
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With' always;
    add_header 'Access-Control-Expose-Headers' 'Authorization' always;

    # OPTIONS 요청 처리
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # ===== 인증/인가 엔드포인트 (인증 불필요) =====
    # 로그인, 회원가입 등은 인증 없이 접근 가능
    location ~ ^/api/auth/(login|register|refresh|validate)$ {
        proxy_pass http://auth-service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # CORS 헤더 전달
        proxy_pass_header Access-Control-Allow-Origin;
        proxy_pass_header Access-Control-Allow-Credentials;
    }

    # ===== JWT 검증을 위한 내부 엔드포인트 =====
    # nginx auth_request 모듈이 사용하는 내부 검증 엔드포인트
    location = /internal/auth/validate {
        internal;
        proxy_pass http://auth-service/api/auth/validate;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header Authorization $http_authorization;
    }

    # ===== User Service 라우팅 =====
    location /api/user/ {
        # JWT 토큰 검증
        auth_request /internal/auth/validate;
        auth_request_set $user_id $upstream_http_x_user_id;
        
        # 검증 실패 시 401 반환
        error_page 401 = @error401;
        
        proxy_pass http://user-service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id $user_id;
        proxy_set_header Authorization $http_authorization;
        
        # 타임아웃 설정
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ===== Problem Service 라우팅 =====
    location /api/problem/ {
        # JWT 토큰 검증
        auth_request /internal/auth/validate;
        auth_request_set $user_id $upstream_http_x_user_id;
        
        # 검증 실패 시 401 반환
        error_page 401 = @error401;
        
        proxy_pass http://problem-service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id $user_id;
        proxy_set_header Authorization $http_authorization;
        
        # 타임아웃 설정
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ===== Learning Analysis Service 라우팅 =====
    location /api/analysis/ {
        # JWT 토큰 검증
        auth_request /internal/auth/validate;
        auth_request_set $user_id $upstream_http_x_user_id;
        
        # 검증 실패 시 401 반환
        error_page 401 = @error401;
        
        proxy_pass http://learning-analysis-service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id $user_id;
        proxy_set_header Authorization $http_authorization;
        
        # 타임아웃 설정
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ===== Media Service 라우팅 =====
    location /api/media/ {
        # JWT 토큰 검증
        auth_request /internal/auth/validate;
        auth_request_set $user_id $upstream_http_x_user_id;
        
        # 검증 실패 시 401 반환
        error_page 401 = @error401;
        
        proxy_pass http://media-service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id $user_id;
        proxy_set_header Authorization $http_authorization;
        
        # 타임아웃 설정
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ===== Speech Service 라우팅 =====
    location /api/speech/ {
        # JWT 토큰 검증
        auth_request /internal/auth/validate;
        auth_request_set $user_id $upstream_http_x_user_id;
        
        # 검증 실패 시 401 반환
        error_page 401 = @error401;
        
        proxy_pass http://speech-service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id $user_id;
        proxy_set_header Authorization $http_authorization;
        
        # 타임아웃 설정
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ===== 헬스 체크 엔드포인트 =====
    location /health {
        access_log off;
        return 200 "API Gateway is healthy\n";
        add_header Content-Type text/plain;
    }

    # ===== 에러 핸들러 =====
    location @error401 {
        return 401 '{"error": "Unauthorized", "message": "Invalid or missing JWT token"}';
        add_header Content-Type application/json;
    }

    location @error403 {
        return 403 '{"error": "Forbidden", "message": "Access denied"}';
        add_header Content-Type application/json;
    }

    # 기본 에러 페이지
    error_page 404 /404.json;
    location = /404.json {
        return 404 '{"error": "Not Found", "message": "The requested resource was not found"}';
        add_header Content-Type application/json;
    }
}

