# Server 설정
server.port=8080

# Spring Application 설정
spring.application.name=api-gateway
spring.main.web-application-type=reactive

# CORS 설정
spring.cloud.gateway.globalcors.cors-configurations[/**].allowed-origin-patterns=*
spring.cloud.gateway.globalcors.cors-configurations[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.cloud.gateway.globalcors.cors-configurations[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations[/**].allow-credentials=true
spring.cloud.gateway.globalcors.cors-configurations[/**].max-age=3600

# Gateway 설정
spring.cloud.gateway.httpclient.connect-timeout=10000
spring.cloud.gateway.httpclient.response-timeout=30000

# JWT 설정
jwt.secret=${JWT_SECRET:your-secret-key-change-this-in-production-minimum-256-bits}
jwt.expiration=3600000

# 로깅 설정
logging.level.com.englishcompass.apigateway=DEBUG
logging.level.org.springframework.cloud.gateway=DEBUG

# Actuator 설정
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Frontend 설정
frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}

